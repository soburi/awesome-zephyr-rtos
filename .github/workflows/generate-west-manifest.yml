name: Generate external module list

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      module_count: ${{ steps.generate.outputs.module_count }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Test manifest generator
        run: python3 -m unittest -v tests/test_generate_west_manifest.py

      - name: Generate external-modules.yml
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          manifest_path="$(mktemp)"
          python3 scripts/generate_west_manifest.py \
            --readme README.md \
            --output "$manifest_path"
          count="$(grep -c '^    - name:' "$manifest_path" || true)"
          echo "module_count=${count}" >> "$GITHUB_OUTPUT"
          echo "manifest_path=${manifest_path}" >> "$GITHUB_OUTPUT"

      - name: Show generated manifest
        run: cat "${{ steps.generate.outputs.manifest_path }}"

      - name: Commit external-modules.yml to the merged branch
        env:
          MANIFEST_PATH: ${{ steps.generate.outputs.manifest_path }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "$TARGET_BRANCH"
          git switch --force-create "$TARGET_BRANCH" \
            "origin/$TARGET_BRANCH"
          cp "$MANIFEST_PATH" external-modules.yml
          git add -- external-modules.yml

          if git diff --cached --quiet; then
            echo "external-modules.yml is unchanged."
            exit 0
          fi

          git commit -m "Update external Zephyr modules"
          git push origin "HEAD:$TARGET_BRANCH"
